<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>
  <rect width="160" height="128" fill="url(#sky)"/>
  <!-- Sunset glow -->
  <ellipse cx="120" cy="65" rx="60" ry="30" fill="url(#sun)"/>
  <!-- Horizon line -->
  <rect x="0" y="72" width="160" height="56" fill="url(#ground)"/>
  <!-- Car silhouette -->
  <path d="M30,82 L42,72 L56,68 L104,68 L118,72 L130,82 L132,82 L132,90 L126,90 L122,86 L112,86 L108,90 L52,90 L48,86 L38,86 L34,90 L28,90 L28,82 Z" fill="#080808"/>
  <!-- Headlight glow -->
  <ellipse cx="130" cy="80" rx="8" ry="4" fill="#ff6b35" opacity="0.3"/>
  <rect x="128" y="78" width="4" height="2" rx="1" fill="#ffaa00" opacity="0.8"/>
  <!-- Taillight -->
  <rect x="29" y="78" width="3" height="2" rx="1" fill="#ff2222" opacity="0.7"/>
  <!-- Reflection on ground -->
  <rect x="40" y="92" width="80" height="1" rx="0.5" fill="#ffffff" opacity="0.03"/>
  <!-- Window -->
  <path d="M46,72 L56,68 L96,68 L106,72 Z" fill="#111" opacity="0.6"/>
</svg>
