<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="160" height="128" fill="url(#night)"/>
  <!-- City ambient -->
  <rect x="10" y="30" width="3" height="40" fill="#111828" opacity="0.8"/>
  <rect x="16" y="20" width="4" height="50" fill="#111828" opacity="0.6"/>
  <rect x="24" y="35" width="3" height="35" fill="#111828" opacity="0.7"/>
  <rect x="130" y="25" width="4" height="45" fill="#111828" opacity="0.7"/>
  <rect x="138" y="32" width="3" height="38" fill="#111828" opacity="0.6"/>
  <rect x="146" y="22" width="4" height="48" fill="#111828" opacity="0.5"/>
  <!-- City window lights -->
  <rect x="11" y="34" width="1" height="1" fill="#ffd700" opacity="0.4"/>
  <rect x="11" y="40" width="1" height="1" fill="#00d4ff" opacity="0.3"/>
  <rect x="17" y="28" width="1" height="1" fill="#ffd700" opacity="0.5"/>
  <rect x="131" y="30" width="1" height="1" fill="#ffd700" opacity="0.4"/>
  <rect x="139" y="38" width="1" height="1" fill="#00d4ff" opacity="0.3"/>
  <rect x="147" y="26" width="1" height="1" fill="#ffd700" opacity="0.4"/>
  <!-- Road -->
  <rect x="0" y="72" width="160" height="56" fill="#050508"/>
  <!-- Road reflection -->
  <rect x="0" y="72" width="160" height="20" fill="url(#neon)"/>
  <!-- Car silhouette - sportier profile -->
  <path d="M25,82 L40,71 L52,67 L108,67 L122,71 L135,82 L137,82 L137,90 L130,90 L126,86 L116,86 L112,90 L48,90 L44,86 L34,86 L30,90 L23,90 L23,82 Z" fill="#060608"/>
  <!-- Headlights - bright -->
  <ellipse cx="136" cy="80" rx="10" ry="5" fill="#00d4ff" opacity="0.2"/>
  <rect x="133" y="78" width="5" height="2" rx="1" fill="#ffffff" opacity="0.9"/>
  <!-- Taillights -->
  <rect x="24" y="78" width="4" height="1.5" rx="0.5" fill="#ff0033" opacity="0.8"/>
  <!-- Light streak on road -->
  <rect x="133" y="92" width="20" height="1" fill="#00d4ff" opacity="0.1"/>
  <rect x="24" y="92" width="10" height="1" fill="#ff0033" opacity="0.08"/>
  <!-- Window -->
  <path d="M44,72 L54,67 L100,67 L112,72 Z" fill="#0a0a12" opacity="0.5"/>
</svg>
