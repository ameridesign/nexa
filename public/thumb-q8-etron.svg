<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128">
  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>
  <rect width="160" height="128" fill="url(#studio)"/>
  <!-- Studio spotlight -->
  <rect width="160" height="128" fill="url(#spot)"/>
  <!-- Floor -->
  <rect x="0" y="76" width="160" height="52" fill="url(#floor)"/>
  <!-- Floor reflection line -->
  <line x1="20" y1="76" x2="140" y2="76" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
  <!-- SUV silhouette - taller profile -->
  <path d="M28,82 L38,68 L52,62 L108,62 L122,68 L132,82 L134,82 L134,92 L128,92 L124,88 L114,88 L110,92 L50,92 L46,88 L36,88 L32,92 L26,92 L26,82 Z" fill="#080a0e"/>
  <!-- Roof rails hint -->
  <line x1="54" y1="62" x2="106" y2="62" stroke="#151820" stroke-width="1"/>
  <!-- Headlight -->
  <rect x="130" y="78" width="4" height="2" rx="1" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="134" cy="80" rx="6" ry="3" fill="#ffffff" opacity="0.08"/>
  <!-- Taillight -->
  <rect x="27" y="78" width="4" height="1.5" rx="0.5" fill="#ff1a1a" opacity="0.6"/>
  <!-- DRL light bar -->
  <line x1="130" y1="74" x2="122" y2="74" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.5"/>
  <!-- Window -->
  <path d="M42,68 L54,62 L100,62 L112,68 Z" fill="#0c0e14" opacity="0.5"/>
  <!-- Floor car reflection -->
  <path d="M32,96 L38,92 L122,92 L128,96 Z" fill="#ffffff" opacity="0.015"/>
</svg>
